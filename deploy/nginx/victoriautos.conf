# Loaded from sites-enabled inside nginx's http context (map cannot be in server).
# CloudFront APPENDS the viewer IP: discard all prepended entries, use RIGHTMOST.
# The SG must restrict port 80 to CloudFront + the trusted admin IP; a direct
# caller allowed by that exception is trusted and must omit X-Forwarded-For.
# Uvicorn trusts only nginx on 127.0.0.1; slowapi sees this single client address.
map $http_x_forwarded_for $victoriautos_client_ip {
    default $remote_addr;
    "~(?:^|,)\s*(?<victoriautos_last_ip>[0-9A-Fa-f:.]+)\s*$" $victoriautos_last_ip;
}

server {
    listen 80;
    server_name victoriautos.com www.victoriautos.com d2gyx3l0a1l011.cloudfront.net ec2-44-217-212-182.compute-1.amazonaws.com 44.217.212.182;
    root /home/ubuntu/victoriautosApp/frontend/dist;
    index index.html;
    server_tokens off;

    # Six files x 20 MiB, plus 5 MiB for multipart boundaries and form fields.
    client_max_body_size 125m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $victoriautos_client_ip;
        proxy_set_header X-Forwarded-For $victoriautos_client_ip;
        # Viewer HTTPS is enforced by CloudFront, though its origin leg is HTTP.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }

    location /images/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $victoriautos_client_ip;
        proxy_set_header X-Forwarded-For $victoriautos_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Preserve the existing separate pm2 simit-api service and prefix rewrite.
    location /simit-api/ {
        rewrite ^/simit-api/(.*)$ /$1 break;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # nginx 1.24: location add_header overrides inherited add_header directives.
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # API docs are disabled in production; don't return a misleading SPA page.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
