[project]
name = "victoriautos-backend"
version = "0.1.0"
description = "Victoria Autos dealership platform API: vehicle inventory, lead-capture forms, admin back office, contract PDF generation, and plate lookups."
authors = [
    { name = "TitoFM16", email = "72289925+TitoFM16@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "anyio>=4.14.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.140.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
victoriautos-backend = "victoriautos_backend:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "ASYNC", # flake8-async
]
ignore = ["B008"]  # FastAPI's Depends(...) in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["victoriautos_backend"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "W291"]  # autogenerated header/DDL, not hand-wrapped

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All async tests/fixtures share one event loop for the session, matching the
# session-scoped asyncpg engine in tests/conftest.py (asyncpg connections are
# bound to the loop they were created on).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/victoriautos_backend"]
